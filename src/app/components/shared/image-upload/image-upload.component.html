<div class="space-y-3">
  <div 
    [class.border-emerald-500]="dragOver()"
    [class.bg-emerald-50\/30]="dragOver()"
    [class.opacity-60]="uploading()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
    (click)="!uploading() && fileInput.click()"
    class="border-2 border-dashed border-slate-200 hover:border-emerald-500 hover:bg-slate-50/50 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer transition duration-150 relative min-h-[160px] overflow-hidden group"
  >
    <input 
      type="file" 
      #fileInput 
      (change)="onFileSelected($event)" 
      accept="image/jpeg,image/png,image/jpg,image/webp" 
      class="hidden"
      [disabled]="uploading()"
    >
 
    <!-- Loading Spinner Overlay -->
    <div *ngIf="uploading()" class="absolute inset-0 bg-white/70 backdrop-blur-xs flex flex-col items-center justify-center z-20 gap-2">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-emerald-500"></div>
      <span class="text-xs font-semibold text-slate-500 animate-pulse">Envoi en cours...</span>
    </div>
 
    <!-- Image Preview Mode -->
    <div *ngIf="imageUrl(); else placeholder" class="w-full flex flex-col items-center gap-3">
      <div class="relative w-full h-36 rounded-xl overflow-hidden border border-slate-100 bg-slate-50 flex items-center justify-center">
        <img [src]="imageUrl()" alt="Aperçu" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition duration-150">
          <span class="text-white text-xs font-bold bg-white/20 backdrop-blur px-3 py-1.5 rounded-lg border border-white/30">Changer la photo</span>
        </div>
      </div>
    </div>
 
    <!-- Placeholder / Drag & Drop instructions -->
    <ng-template #placeholder>
      <div class="flex flex-col items-center text-center gap-2">
        <div class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 group-hover:text-emerald-500 group-hover:bg-emerald-50 transition duration-150">
          <i class="ti ti-photo-plus text-2xl"></i>
        </div>
        <div class="text-sm font-semibold text-slate-700">
          Glissez-déposez une photo ici, ou <span class="text-emerald-600 hover:text-emerald-700">parcourez</span>
        </div>
        <p class="text-xs text-slate-400">
          Formats acceptés : JPG, PNG, WEBP (Max : 5 Mo)
        </p>
      </div>
    </ng-template>
  </div>
</div>
