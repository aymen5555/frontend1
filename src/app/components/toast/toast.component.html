<div class="fixed bottom-4 right-4 z-50 flex flex-col gap-2">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="rounded-xl shadow-lg px-4 py-3 flex items-center gap-3 animate-slide-up min-w-[280px] text-white"
         [class.bg-emerald-500]="toast.type === 'success'"
         [class.bg-red-500]="toast.type === 'error'"
         [class.bg-yellow-500]="toast.type === 'warning'">
      <span class="text-lg">
        @if (toast.type === 'success') { ✅ }
        @if (toast.type === 'error') { ❌ }
        @if (toast.type === 'warning') { ⚠️ }
      </span>
      <span class="flex-1 text-sm font-medium">{{ toast.message }}</span>
      <button (click)="toastService.removeToast(toast.id)" class="text-white/80 hover:text-white transition-colors text-sm font-bold">✕</button>
    </div>
  }
</div>
