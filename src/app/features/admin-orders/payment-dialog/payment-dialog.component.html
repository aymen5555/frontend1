<h2 mat-dialog-title class="font-bold text-lg text-slate-900 mb-3">
  Confirmer le paiement — Commande #{{ data.order.id }}
</h2>

<form [formGroup]="paymentForm" (ngSubmit)="save()">
  <mat-dialog-content class="space-y-5">
    <!-- Payment method -->
    <div class="flex flex-col gap-2">
      <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Méthode de paiement *</label>
      <div class="grid grid-cols-2 gap-3">
        <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer transition"
          [ngClass]="paymentForm.get('modalite_paiement')?.value === 'especes' ? 'border-primary bg-primary/5 ring-1 ring-primary' : 'border-slate-200 hover:bg-slate-50'">
          <input type="radio" formControlName="modalite_paiement" value="especes" class="sr-only" />
          <span class="font-semibold text-sm text-slate-800">💵 Espèces</span>
        </label>
        <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer transition"
          [ngClass]="paymentForm.get('modalite_paiement')?.value === 'carte' ? 'border-primary bg-primary/5 ring-1 ring-primary' : 'border-slate-200 hover:bg-slate-50'">
          <input type="radio" formControlName="modalite_paiement" value="carte" class="sr-only" />
          <span class="font-semibold text-sm text-slate-800">💳 Carte</span>
        </label>
      </div>
    </div>

    <!-- Reference (required only for card) -->
    <div *ngIf="isCarte" class="flex flex-col gap-1.5">
      <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">
        Référence de transaction *
        <span class="text-red-500 ml-1">(obligatoire pour carte)</span>
      </label>
      <input type="text" formControlName="reference" placeholder="Ex: TXN-2026-00123"
        class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-150"
        [ngClass]="paymentForm.get('reference')?.invalid && paymentForm.get('reference')?.touched ? 'border-red-400' : ''" />
      <span *ngIf="paymentForm.get('reference')?.invalid && paymentForm.get('reference')?.touched"
        class="text-xs text-red-500 font-semibold">La référence est obligatoire pour les paiements par carte.</span>
    </div>

    <!-- Summary info -->
    <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
      <p class="text-xs text-slate-400 font-semibold uppercase tracking-wider mb-1">Montant à confirmer</p>
      <p class="text-xl font-extrabold text-primary">{{ data.order.montant_total | number:'1.2-2' }} TND</p>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="flex justify-end gap-2 mt-6 pt-4 border-t border-slate-100">
    <button type="button" (click)="cancel()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-xl transition cursor-pointer">
      Annuler
    </button>
    <button type="submit" [disabled]="paymentForm.invalid" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-100 disabled:text-slate-400 text-white font-semibold text-sm rounded-xl transition cursor-pointer">
      ✓ Confirmer le paiement
    </button>
  </mat-dialog-actions>
</form>
