<h2 mat-dialog-title class="font-bold text-lg text-slate-900 mb-3">
  Statut de la commande : #{{ data.order.id }}
</h2>

<form [formGroup]="statusForm" (ngSubmit)="save()">
  <mat-dialog-content class="space-y-4">
    <!-- Status Selection -->
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">
        Statut de préparation / livraison *
      </label>
      <select formControlName="statut"
        class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-150">
        <option *ngFor="let st of statuses" [value]="st.value">
          {{ st.label }}
        </option>
      </select>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="flex justify-end gap-2 mt-6 pt-4 border-t border-slate-100">
    <button type="button" (click)="cancel()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-xl transition duration-150 cursor-pointer">
      Annuler
    </button>
    <button type="submit" [disabled]="statusForm.invalid" class="px-4 py-2 bg-primary hover:bg-primary-hover disabled:bg-slate-100 disabled:text-slate-400 text-white font-semibold text-sm rounded-xl transition duration-150 cursor-pointer">
      Mettre à jour
    </button>
  </mat-dialog-actions>
</form>
