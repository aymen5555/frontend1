<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in">
  <header class="mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Équipements</h1>
      <p class="text-slate-600 mt-2">Catalogue d'équipements et association aux complexes.</p>
    </div>
    <button (click)="openCreate()" class="inline-flex items-center px-4 py-2.5 bg-primary hover:bg-primary-hover text-white font-bold rounded-xl shadow-sm transition cursor-pointer">
      + Nouvel Équipement
    </button>
  </header>

  <div *ngIf="showForm()" class="glass-panel p-6 rounded-2xl mb-6 animate-fade-in">
    <h2 class="font-bold text-lg text-slate-900 mb-4">{{ editing() ? 'Modifier' : 'Nouvel équipement' }}</h2>
    <form [formGroup]="form" (ngSubmit)="save()" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Nom *</label>
        <input type="text" formControlName="nom_eq" placeholder="Ex: Wifi" class="bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" />
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Icône (emoji)</label>
        <input type="text" formControlName="icone_eq" placeholder="📶" class="bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" />
      </div>
      <div class="md:col-span-2 flex justify-end gap-3 pt-4 border-t border-slate-100">
        <button type="button" (click)="closeForm()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-xl transition cursor-pointer">Annuler</button>
        <button type="submit" [disabled]="form.invalid || submitting()" class="px-4 py-2 bg-primary hover:bg-primary-hover disabled:bg-slate-100 disabled:text-slate-400 text-white font-semibold text-sm rounded-xl transition cursor-pointer">
          {{ submitting() ? '...' : (editing() ? 'Mettre à jour' : 'Créer') }}
        </button>
      </div>
    </form>
  </div>

  <div class="mb-6">
    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Complexe pour association</label>
    <select (change)="onComplexeChange()" [value]="selectedComplexeId() || ''" class="bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all w-full md:w-64">
      <option value="" disabled>Sélectionner</option>
      <option *ngFor="let c of complexes()" [value]="c.id">{{ c.name }}</option>
    </select>
  </div>

  <div *ngIf="loading()" class="flex justify-center py-20">
    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-primary"></div>
  </div>

  <div *ngIf="!loading() && equipements().length === 0" class="glass-panel text-center py-16 rounded-3xl">
    <span class="text-5xl block mb-4">🏗️</span>
    <h3 class="font-bold text-xl text-slate-900">Aucun équipement</h3>
    <p class="text-slate-500 mt-2">Créez votre premier équipement.</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    <div *ngFor="let e of equipements()" class="glass-panel p-4 rounded-2xl flex items-center justify-between">
      <div>
        <span class="text-2xl mr-2">{{ e.icone_eq || '📌' }}</span>
        <span class="font-bold text-slate-900">{{ e.nom_eq }}</span>
      </div>
      <div class="flex gap-2">
        @if (selectedComplexeId()) {
          <button (click)="toggleAttach(e)" class="px-3 py-1.5 text-xs font-bold rounded-lg transition cursor-pointer"
            [ngClass]="isAttached(e.id) ? 'bg-red-50 hover:bg-red-100 text-red-600' : 'bg-emerald-50 hover:bg-emerald-100 text-emerald-700'">
            {{ isAttached(e.id) ? 'Détacher' : 'Attacher' }}
          </button>
        }
        <button (click)="openEdit(e)" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-lg transition cursor-pointer">Modifier</button>
        <button (click)="remove(e)" class="px-2.5 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 font-bold text-xs rounded-lg transition cursor-pointer">Supprimer</button>
      </div>
    </div>
  </div>
</div>
