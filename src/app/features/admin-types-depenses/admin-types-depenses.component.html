<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in">
  <header class="mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Types de Dépenses</h1>
      <p class="text-slate-600 mt-2">Catégories de dépenses (Loyer, Électricité, Maintenance...).</p>
    </div>
    <button (click)="openCreate()" class="inline-flex items-center px-4 py-2.5 bg-primary hover:bg-primary-hover text-white font-bold rounded-xl shadow-sm transition cursor-pointer">
      + Nouveau Type
    </button>
  </header>

  <div *ngIf="showForm()" class="glass-panel p-6 rounded-2xl mb-6 animate-fade-in">
    <h2 class="font-bold text-lg text-slate-900 mb-4">{{ editing() ? 'Modifier' : 'Nouveau type' }}</h2>
    <form [formGroup]="form" (ngSubmit)="save()" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Désignation *</label>
        <input type="text" formControlName="designation_ty_dep" placeholder="Ex: Loyer" class="bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" />
      </div>
      <div class="flex items-center gap-2 pt-6">
        <input type="checkbox" formControlName="active" id="activeCheck" class="rounded border-slate-300 text-primary focus:ring-primary" />
        <label for="activeCheck" class="text-sm font-semibold text-slate-700">Actif</label>
      </div>
      <div class="md:col-span-2 flex justify-end gap-3 pt-4 border-t border-slate-100">
        <button type="button" (click)="closeForm()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-xl transition cursor-pointer">Annuler</button>
        <button type="submit" [disabled]="form.invalid || submitting()" class="px-4 py-2 bg-primary hover:bg-primary-hover disabled:bg-slate-100 disabled:text-slate-400 text-white font-semibold text-sm rounded-xl transition cursor-pointer">
          {{ submitting() ? '...' : (editing() ? 'Mettre à jour' : 'Créer') }}
        </button>
      </div>
    </form>
  </div>

  <div *ngIf="loading()" class="flex justify-center py-20">
    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-primary"></div>
  </div>

  <div *ngIf="!loading() && types().length === 0" class="glass-panel text-center py-16 rounded-3xl">
    <span class="text-5xl block mb-4">📂</span>
    <h3 class="font-bold text-xl text-slate-900">Aucun type</h3>
    <p class="text-slate-500 mt-2">Créez votre premier type de dépense.</p>
  </div>

  <div *ngIf="!loading() && types().length > 0" class="glass-panel p-6 rounded-2xl overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm text-left border-collapse">
        <thead>
          <tr class="border-b border-slate-100 text-slate-400 font-bold uppercase tracking-wider text-xs">
            <th class="py-4 px-3">Désignation</th>
            <th class="py-4 px-3">Statut</th>
            <th class="py-4 px-3 text-right">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-50">
          <tr *ngFor="let t of types()" class="hover:bg-slate-50/50 transition-colors">
            <td class="py-4 px-3 font-bold text-slate-900">{{ t.designation_ty_dep }}</td>
            <td class="py-4 px-3">
              <span class="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-semibold" [ngClass]="t.active ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'">
                {{ t.active ? 'Actif' : 'Inactif' }}
              </span>
            </td>
            <td class="py-4 px-3 text-right">
              <div class="flex items-center justify-end gap-2">
                <button (click)="openEdit(t)" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-lg transition cursor-pointer">Modifier</button>
                <button (click)="remove(t)" class="px-2.5 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 font-bold text-xs rounded-lg transition cursor-pointer">Supprimer</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
