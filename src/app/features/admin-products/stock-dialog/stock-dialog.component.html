<h2 mat-dialog-title class="font-bold text-lg text-slate-900 mb-3">
  Mise à jour du stock : {{ data.product.nom }}
</h2>

<form [formGroup]="stockForm" (ngSubmit)="save()">
  <mat-dialog-content class="space-y-4">
    <!-- Stock Disponible input -->
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">
        Quantité disponible en stock *
      </label>
      <input type="number" formControlName="quantite_disponible" min="0"
        class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-150" />
    </div>

    <!-- Stock Minimal input -->
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">
        Seuil d'alerte de stock minimal *
      </label>
      <input type="number" formControlName="quantite_minimale" min="1"
        class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-150" />
      <span class="text-[10px] text-slate-400">
        Un indicateur rouge s'affichera quand le stock sera inférieur ou égal à ce seuil.
      </span>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="flex justify-end gap-2 mt-6 pt-4 border-t border-slate-100">
    <button type="button" (click)="cancel()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-xl transition duration-150 cursor-pointer">
      Annuler
    </button>
    <button type="submit" [disabled]="stockForm.invalid" class="px-4 py-2 bg-primary hover:bg-primary-hover disabled:bg-slate-100 disabled:text-slate-400 text-white font-semibold text-sm rounded-xl transition duration-150 cursor-pointer">
      Enregistrer
    </button>
  </mat-dialog-actions>
</form>
