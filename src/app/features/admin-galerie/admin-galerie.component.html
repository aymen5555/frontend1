<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in">
  <header class="mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Galerie Complexe</h1>
      <p class="text-slate-600 mt-2">Gérez les images de la galerie pour chaque complexe.</p>
    </div>
  </header>

  <div class="glass-panel p-6 rounded-2xl mb-6">
    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Complexe</label>
    <select (change)="onComplexeChange()" [value]="selectedComplexeId() || ''" class="bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all w-full md:w-64">
      <option value="" disabled>Sélectionner</option>
      <option *ngFor="let c of complexes()" [value]="c.id">{{ c.name }}</option>
    </select>
  </div>

  <div *ngIf="showUpload()" class="glass-panel p-6 rounded-2xl mb-6 animate-fade-in">
    <h2 class="font-bold text-lg text-slate-900 mb-4">Ajouter des images</h2>
    <div class="flex flex-col gap-4">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div *ngFor="let pf of pendingFiles; let i = index" class="relative aspect-video rounded-xl overflow-hidden border border-slate-200">
          <img [src]="pf.preview" class="w-full h-full object-cover" />
          <button (click)="removeGalerie(pf)" class="absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 text-xs font-bold">×</button>
        </div>
      </div>
      <div class="flex justify-end gap-3">
        <button type="button" (click)="cancelUpload()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-xl transition cursor-pointer">Annuler</button>
        <button (click)="uploadImages()" [disabled]="uploading()" class="px-4 py-2 bg-primary hover:bg-primary-hover disabled:bg-slate-100 disabled:text-slate-400 text-white font-semibold text-sm rounded-xl transition cursor-pointer">
          {{ uploading() ? 'Upload...' : 'Ajouter' }}
        </button>
      </div>
    </div>
  </div>

  <div class="mb-6">
    <button (click)="showUpload.set(true)" [disabled]="galeries().length >= 10" class="px-4 py-2 bg-primary hover:bg-primary-hover disabled:bg-slate-100 disabled:text-slate-400 text-white font-bold rounded-xl shadow-sm transition cursor-pointer">
      + Ajouter Image
    </button>
  </div>

  <div *ngIf="loading()" class="flex justify-center py-20">
    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-primary"></div>
  </div>

  <div *ngIf="!loading() && galeries().length === 0" class="glass-panel text-center py-16 rounded-3xl">
    <span class="text-5xl block mb-4">🖼️</span>
    <h3 class="font-bold text-xl text-slate-900">Aucune image</h3>
    <p class="text-slate-500 mt-2">Ajoutez des images pour ce complexe.</p>
  </div>

  <div *ngIf="!loading() && galeries().length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let g of galeries()" class="glass-panel rounded-2xl overflow-hidden animate-fade-in">
      <div class="aspect-video">
        <img [src]="g.image_url" class="w-full h-full object-cover" />
      </div>
      <div class="p-4 flex justify-between items-center">
        <span class="text-xs text-slate-500">Ordre: {{ g.ordre }}</span>
        <button (click)="removeGalerie(g)" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 font-bold text-xs rounded-lg transition cursor-pointer">Supprimer</button>
      </div>
    </div>
  </div>
</div>
