<div class="min-h-screen bg-gray-50 py-8">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="bg-white rounded-3xl shadow-sm border-2 border-black overflow-hidden">
      <!-- Header -->
      <div class="bg-emerald-500 px-6 py-6 text-white border-b-2 border-black">
        <h1 class="text-2xl font-extrabold flex items-center gap-2">👤 Mon Profil</h1>
        <p class="text-emerald-50 text-sm mt-1">Gérez vos informations personnelles et votre avatar</p>
      </div>

      <div class="p-6 sm:p-8">
        @if (loading()) {
          <!-- Skeleton Loading -->
          <div class="animate-pulse space-y-6">
            <div class="h-12 bg-gray-200 rounded-xl w-1/3"></div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
              <div class="h-10 bg-gray-200 rounded-xl w-full"></div>
              <div class="h-10 bg-gray-200 rounded-xl w-full"></div>
            </div>
            <div class="h-10 bg-gray-200 rounded-xl w-full"></div>
            <div class="h-24 bg-gray-200 rounded-xl w-full"></div>
          </div>
        } @else {
          <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="space-y-6">
            <!-- Row: Avatar upload -->
            <div class="flex flex-col sm:flex-row items-center gap-6 pb-6 border-b border-gray-100">
              <div class="w-32 h-32 rounded-full overflow-hidden border-4 border-black bg-gray-100 flex items-center justify-center relative shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex-shrink-0">
                @if (avatarUrl()) {
                  <img [src]="avatarUrl()" alt="Avatar" class="w-full h-full object-cover">
                } @else {
                  <span class="text-4xl text-gray-400">👤</span>
                }
              </div>
              <div class="flex-grow w-full">
                <label class="block text-sm font-bold text-gray-700 mb-2">Photo de profil</label>
                <app-image-upload [imageUrl]="avatarUrl()" (imageUploaded)="onImageUploaded($event)"></app-image-upload>
              </div>
            </div>

            <!-- Row: Nom & Prénom -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-1.5">Prénom</label>
                <input type="text" formControlName="first_name"
                  class="w-full px-4 py-3 border-2 border-black rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 transition-all">
                <p *ngIf="profileForm.get('first_name')?.touched && profileForm.get('first_name')?.errors?.['required']" class="text-red-500 text-xs mt-1">Le prénom est requis.</p>
              </div>
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-1.5">Nom</label>
                <input type="text" formControlName="last_name"
                  class="w-full px-4 py-3 border-2 border-black rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 transition-all">
                <p *ngIf="profileForm.get('last_name')?.touched && profileForm.get('last_name')?.errors?.['required']" class="text-red-500 text-xs mt-1">Le nom est requis.</p>
              </div>
            </div>

            <!-- Row: Email (Disabled) & Téléphone -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
              <div>
                <label class="block text-sm font-bold text-gray-400 mb-1.5">Adresse Email <span class="text-xs font-normal">(Non modifiable)</span></label>
                <input type="email" formControlName="email"
                  class="w-full px-4 py-3 border-2 border-gray-200 bg-gray-50 rounded-xl cursor-not-allowed text-gray-500 focus:outline-none">
              </div>
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-1.5">Téléphone</label>
                <input type="text" formControlName="phone" placeholder="+216 -- --- ---"
                  class="w-full px-4 py-3 border-2 border-black rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 transition-all">
              </div>
            </div>

            <!-- Row: Date de naissance & Sexe -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-1.5">Date de naissance</label>
                <input type="date" formControlName="date_naissance"
                  class="w-full px-4 py-3 border-2 border-black rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 transition-all">
              </div>
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-1.5">Genre</label>
                <select formControlName="sexe"
                  class="w-full px-4 py-3 border-2 border-black rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 transition-all bg-white">
                  <option value="">Sélectionner</option>
                  <option value="homme">Homme</option>
                  <option value="femme">Femme</option>
                  <option value="autre">Autre</option>
                </select>
              </div>
            </div>

            <!-- Row: Profession -->
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1.5">Profession</label>
              <input type="text" formControlName="profession" placeholder="Votre métier"
                class="w-full px-4 py-3 border-2 border-black rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 transition-all">
            </div>

            <!-- Row: Adresse -->
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1.5">Adresse postale</label>
              <input type="text" formControlName="address" placeholder="123 Rue de la République, Tunis"
                class="w-full px-4 py-3 border-2 border-black rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 transition-all">
            </div>

            <!-- Submit button -->
            <div class="pt-4 border-t-2 border-gray-100 flex items-center justify-between gap-4">
              <button type="submit" [disabled]="profileForm.invalid || submitting()"
                class="w-full sm:w-auto bg-emerald-500 hover:bg-emerald-600 disabled:bg-emerald-300 disabled:cursor-not-allowed text-white font-bold py-3 px-10 rounded-xl border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] hover:translate-x-[2px] hover:translate-y-[2px] transition-all text-base">
                {{ submitting() ? 'Enregistrement...' : 'Enregistrer les modifications' }}
              </button>
              <a routerLink="/mon-profil-fitness"
                class="text-emerald-600 hover:underline font-bold text-sm flex items-center gap-1.5">
                💪 Gérer mon profil fitness
              </a>
            </div>
          </form>
        }
      </div>
    </div>
  </div>
</div>
