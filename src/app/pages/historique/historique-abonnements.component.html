<div class="min-h-screen bg-gray-50 py-12">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
    <h1 class="text-3xl font-bold text-gray-900 mb-6">Historique des abonnements</h1>

    <div *ngIf="loading()" class="space-y-4">
      <div *ngFor="let i of [1,2]" class="bg-white rounded-2xl shadow-sm p-6 animate-pulse"></div>
    </div>

    <div *ngIf="!loading() && abonnements().length === 0" class="bg-white rounded-3xl p-12 text-center shadow-sm">
      <div class="text-6xl mb-4">🗃️</div>
      <h3 class="text-xl font-bold text-gray-900 mb-2">Aucun abonnement historique</h3>
      <p class="text-gray-500">Vous n'avez pas d'abonnements expirés ou annulés.</p>
    </div>

    <div *ngIf="!loading() && abonnements().length > 0" class="grid grid-cols-1 gap-4">
      <div *ngFor="let a of abonnements()" class="bg-white rounded-2xl shadow-sm p-6 border-l-4" [ngClass]="a.statut === 'annule' ? 'border-red-400' : 'border-gray-300'">
        <div class="flex justify-between items-center">
          <div>
            <div class="font-bold text-gray-900">{{ a.type_abonnement?.nom || 'Abonnement' }}</div>
            <div class="text-sm text-gray-500">{{ a.complexe?.name }}</div>
            <div class="text-xs text-gray-400">{{ a.date_debut }} → {{ a.date_fin }}</div>
          </div>
          <div class="text-sm text-gray-600">{{ a.statut }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
